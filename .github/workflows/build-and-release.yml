name: build-and-release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Audit de dependencias
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Tests (modelo + seguridad)
        run: node test.js
      - name: Instalar deps
        working-directory: desktop
        run: npm ci
      - name: Asegurar binario de Electron
        working-directory: desktop
        run: node node_modules/electron/install.js
      - name: Aplicar fuses de Electron
        working-directory: desktop
        run: npm run fuses
      - name: Build instalador
        working-directory: desktop
        run: npm run dist
      - name: Publicar Release + feed de auto-update (idempotente)
        working-directory: desktop
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$ver"
          $exe = "release\Tempo-$ver-Setup.exe"
          $exists = gh release view $tag 2>$null
          if ($exists) {
            Write-Host "Release $tag ya existe, actualizando assets (tolerante a re-runs)"
            gh release upload $tag $exe "$exe.blockmap" "release\latest.yml" --clobber
          } else {
            gh release create $tag $exe "$exe.blockmap" "release\latest.yml" --title "Tempo $ver" --notes "Build audited, tests passed, fuses enabled."
          }
        env:
          GH_TOKEN: ${{ github.token }}