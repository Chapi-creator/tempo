<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tempo: tablero Kanban offline, sin cuenta ni backend. Gratis, en tu navegador.">
<title>Tempo — Kanban offline y gratis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Crect x='12' y='14' width='14' height='36' rx='4' fill='%234f8cff'/%3E%3Crect x='25' y='14' width='14' height='36' rx='4' fill='%23ffd43b'/%3E%3Crect x='38' y='14' width='14' height='36' rx='4' fill='%2369db7c'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tempo">
<meta property="og:title" content="Tempo — tablero Kanban gratis y offline">
<meta property="og:description" content="Kanban en tu navegador, sin cuenta, sin backend, sin costo. Construido con Opencode y $0. Pruébalo.">
<meta property="og:url" content="https://tempo-board.vercel.app/">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e232d; --border: #2a303c;
    --text: #e6e9ef; --muted: #8b93a5; --accent: #4f8cff;
    --tag1: #ff6b6b; --tag2: #ffa94d; --tag3: #ffd43b; --tag4: #69db7c;
    --tag5: #38d9a9; --tag6: #4dabf7; --tag7: #9775fa; --tag8: #f783ac;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; font-weight: 700; margin-right: auto; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tag4); }
  .dot.offline { background: var(--tag1); }
  select#boardSel {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; max-width: 180px;
  }
  .board-count { font-size: 12px; color: var(--muted); }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  /* Barra de búsqueda y filtros */
  .filter-bar {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 66px; z-index: 4;
  }
  .filter-bar input[type="search"] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 11px; font-size: 13px; font-family: inherit; width: 220px;
  }
  .filter-bar input[type="search"]::placeholder { color: var(--muted); }
  .tag-chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;
    padding: 0; cursor: pointer; flex-shrink: 0;
  }
  .chip.all {
    width: auto; height: auto; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--muted); font-size: 12px; padding: 3px 10px;
  }
  .chip.active { border-color: var(--text); color: var(--text); }
  main { padding: 20px; display: flex; gap: 16px; overflow-x: auto; align-items: flex-start; }
  .column {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    width: 280px; min-width: 280px; display: flex; flex-direction: column; max-height: calc(100vh - 180px);
  }
  .column.dragover { border-color: var(--accent); background: var(--panel2); }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .col-title { font-weight: 700; font-size: 14px; }
  .col-count { font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 20px; padding: 2px 8px; }
  .col-head .grow { flex: 1; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 15px; }
  .icon-btn:hover { color: var(--text); }
  .cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 40px; }
  .card {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; cursor: grab; position: relative;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .card p { color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .card.overdue { border-color: var(--tag1); }
  .card.overdue h3 { color: var(--tag1); }
  .due.overdue { color: var(--tag1); font-weight: 700; }
  .overdue-badge {
    background: var(--tag1); color: #fff; font-size: 12px; font-weight: 700;
    border-radius: 12px; padding: 3px 10px; display: none;
  }
  .overdue-badge.open { display: inline-block; }
  .tag { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .due { font-size: 11px; color: var(--muted); }
  .add-col-btn { align-self: center; margin: 4px; }
  /* Overlay editor */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  .overlay.open { display: flex; }
  .editor {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px;
  }
  .editor h2 { font-size: 16px; }
  .editor label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  .editor input, .editor textarea, .editor select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; width: 100%;
  }
  .editor textarea { resize: vertical; min-height: 70px; }
  .editor .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .tag-select { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-opt { width: 26px; height: 26px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .tag-opt.selected { border-color: var(--text); }
  .tag-opt.none { background: var(--panel2); border: 1px dashed var(--border); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 16px; border: 1px dashed var(--border); border-radius: 10px; }
  body.light {
    --bg: #f3f5f9; --panel: #fff; --panel2: #f1f3f7; --border: #e0e4ec;
    --text: #1a1d24; --muted: #626a7a;
  }
  [hidden] { display: none !important; }
  /* Stats panel */
  .stats-panel {
    display: none; padding: 16px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 20px; align-items: flex-end;
  }
  .stats-panel.open { display: flex; }
  .stats-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .stats-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  .bar { width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .bar span { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }
  .bar-day { font-size: 10px; color: var(--muted); text-align: center; width: 22px; margin-top: 4px; }
  .stats-total { font-size: 24px; font-weight: 800; color: var(--accent); }
  .stats-total-label { font-size: 11px; color: var(--muted); }
  /* Cabecera de impresión (visible solo en papel/PDF) */
  .print-head { display: none; }
  @media print {
    body { background: #fff; color: #000; }
    header, .filter-bar, .stats-panel, .overlay { display: none !important; }
    .print-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; padding: 8px 20px 12px; border-bottom: 2px solid #000; margin: 0 8px 16px;
    }
    .print-head .pt-title { font-size: 20px; font-weight: 700; }
    .print-head .pt-meta { font-size: 11px; color: #444; text-align: right; }
    main { padding: 0 8px; gap: 14px; flex-wrap: wrap; overflow: visible; align-items: flex-start; }
    .column {
      width: 260px; min-width: 260px; max-height: none; break-inside: avoid;
      border: 1px solid #999; background: #fff;
    }
    .col-head { border-bottom: 1px solid #999; }
    .col-title, .col-count { color: #000; }
    .cards { max-height: none; overflow: visible; }
    .card { background: #fff; border: 1px solid #bbb; break-inside: avoid; cursor: default; }
    .card.dragging { opacity: 1; }
    .meta .due { color: #333; }
    .empty { border: 1px dashed #999; color: #888; }
    .icon-btn, .add-card, .add-col-btn { display: none !important; }
    .tag, .dot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header>
  <h1>Tempo</h1>
  <select id="boardSel" title="Tableros"></select>
  <span class="board-count" id="boardCount"></span>
  <button id="newBoardBtn" title="Nuevo tablero">＋</button>
  <button id="renameBoardBtn" title="Renombrar tablero">✎</button>
  <button id="deleteBoardBtn" title="Borrar tablero">🗑</button>
  <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">online</span></span>
  <span class="overdue-badge" id="overdueBadge" title="Tarjetas vencidas">⚠</span>
  <button id="themeBtn" title="Tema claro/oscuro">🌙</button>
  <button id="printBtn" title="Imprimir / guardar PDF">🖨</button>
  <button id="exportBtn" title="Guardar copia en JSON">⬇ Exportar</button>
  <button id="importBtn" title="Cargar copia desde JSON">⬆ Importar</button>
  <button id="statsBtn" title="Estadísticas">📊</button>
  <input type="file" id="fileInput" accept=".json" hidden>
  <button class="primary" id="addColBtn">+ Columna</button>
</header>

<div class="filter-bar">
  <input type="search" id="searchInput" placeholder="Buscar tarjetas…" autocomplete="off">
  <div class="tag-chips" id="tagChips"></div>
</div>

<div class="stats-panel" id="statsPanel">
  <div>
    <div class="stats-title">Tareas completadas · últimos 14 días</div>
    <div class="stats-chart" id="statsChart"></div>
  </div>
  <div>
    <div class="stats-total" id="statsTotal">0</div>
    <div class="stats-total-label">completadas en total</div>
  </div>
</div>

<div class="print-head">
  <span class="pt-title" id="printTitle">Tempo</span>
  <span class="pt-meta"><span id="printDate"></span> · <span id="printStats"></span></span>
</div>

<main id="board" data-model="kanban.v1"></main>

<div class="overlay" id="overlay">
  <div class="editor">
    <h2 id="editorTitle">Editar tarjeta</h2>
    <label>Título <input id="edTitle" maxlength="80" placeholder="¿Qué hay que hacer?"></label>
    <label>Descripción <textarea id="edDesc" placeholder="Detalles…"></textarea></label>
    <label>Etiqueta
      <div class="tag-select" id="tagSelect"></div>
    </label>
    <label>Fecha límite <input type="date" id="edDue"></label>
    <div class="btns">
      <button id="dupBtn" class="btn:red" style="margin-right:auto">⧉ Duplicar</button>
      <button id="delBtn">🗑 Borrar</button>
      <button id="cancelBtn">Cancelar</button>
      <button class="primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="boardStore.js"></script>
<script src="ui.js"></script>
</body>
</html>
