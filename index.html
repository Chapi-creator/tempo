<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e232d; --border: #2a303c;
    --text: #e6e9ef; --muted: #8b93a5; --accent: #4f8cff;
    --tag1: #ff6b6b; --tag2: #ffa94d; --tag3: #ffd43b; --tag4: #69db7c;
    --tag5: #38d9a9; --tag6: #4dabf7; --tag7: #9775fa; --tag8: #f783ac;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; font-weight: 700; margin-right: auto; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tag4); }
  .dot.offline { background: var(--tag1); }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  main { padding: 20px; display: flex; gap: 16px; overflow-x: auto; align-items: flex-start; }
  .column {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    width: 280px; min-width: 280px; display: flex; flex-direction: column; max-height: calc(100vh - 140px);
  }
  .column.dragover { border-color: var(--accent); background: var(--panel2); }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .col-title { font-weight: 700; font-size: 14px; }
  .col-count { font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 20px; padding: 2px 8px; }
  .col-head .grow { flex: 1; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 15px; }
  .icon-btn:hover { color: var(--text); }
  .cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 40px; }
  .card {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; cursor: grab; position: relative;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .card p { color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .tag { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .due { font-size: 11px; color: var(--muted); }
  .add-col-btn { align-self: center; margin: 4px; }
  /* Overlay editor */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  .overlay.open { display: flex; }
  .editor {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px;
  }
  .editor h2 { font-size: 16px; }
  .editor label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  .editor input, .editor textarea, .editor select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; width: 100%;
  }
  .editor textarea { resize: vertical; min-height: 70px; }
  .editor .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .tag-select { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-opt { width: 26px; height: 26px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .tag-opt.selected { border-color: var(--text); }
  .tag-opt.none { background: var(--panel2); border: 1px dashed var(--border); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 16px; border: 1px dashed var(--border); border-radius: 10px; }
  body.light {
    --bg: #f3f5f9; --panel: #fff; --panel2: #f1f3f7; --border: #e0e4ec;
    --text: #1a1d24; --muted: #626a7a;
  }
  [hidden] { display: none !important; }
  /* Stats panel */
  .stats-panel {
    display: none; padding: 16px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 20px; align-items: flex-end;
  }
  .stats-panel.open { display: flex; }
  .stats-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .stats-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  .bar { width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .bar span { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }
  .bar-day { font-size: 10px; color: var(--muted); text-align: center; width: 22px; margin-top: 4px; }
  .stats-total { font-size: 24px; font-weight: 800; color: var(--accent); }
  .stats-total-label { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Tempo</h1>
  <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">online</span></span>
  <button id="themeBtn" title="Tema claro/oscuro">🌙</button>
  <button id="exportBtn" title="Guardar copia en JSON">⬇ Exportar</button>
  <button id="importBtn" title="Cargar copia desde JSON">⬆ Importar</button>
  <button id="statsBtn" title="Estadísticas">📊</button>
  <input type="file" id="fileInput" accept=".json" hidden>
  <button class="primary" id="addColBtn">+ Columna</button>
</header>

<div class="stats-panel" id="statsPanel">
  <div>
    <div class="stats-title">Tareas completadas · últimos 14 días</div>
    <div class="stats-chart" id="statsChart"></div>
  </div>
  <div>
    <div class="stats-total" id="statsTotal">0</div>
    <div class="stats-total-label">completadas en total</div>
  </div>
</div>

<main id="board" data-model="kanban.v1"></main>

<div class="overlay" id="overlay">
  <div class="editor">
    <h2 id="editorTitle">Editar tarjeta</h2>
    <label>Título <input id="edTitle" maxlength="80" placeholder="¿Qué hay que hacer?"></label>
    <label>Descripción <textarea id="edDesc" placeholder="Detalles…"></textarea></label>
    <label>Etiqueta
      <div class="tag-select" id="tagSelect"></div>
    </label>
    <label>Fecha límite <input type="date" id="edDue"></label>
    <div class="btns">
      <button id="delBtn" class="btn:red" style="margin-right:auto">🗑 Borrar</button>
      <button id="cancelBtn">Cancelar</button>
      <button class="primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const boardEl = $('board');
const state = {
  board: KanbanModel.newBoard(),
  colId: null, cardId: null, editingTab: null
};

const TAGS = ['', 'tag1','tag2','tag3','tag4','tag5','tag6','tag7','tag8'];
const TAG_LABEL = { tag1:'Rojo', tag2:'Naranja', tag3:'Amarillo', tag4:'Verde', tag5:'Turquesa', tag6:'Azul', tag7:'Morado', tag8:'Rosa' };

function persist() {
  localStorage.setItem('board.data', KanbanModel.serialize(state.board));
}
function load() {
  try {
    const raw = localStorage.getItem('board.data');
    if (raw) state.board = KanbanModel.deserialize(raw);
  } catch (e) { state.board = KanbanModel.newBoard(); }
}

let events = [];
function loadEvents() {
  try {
    const raw = localStorage.getItem('board.events');
    if (raw) events = JSON.parse(raw);
  } catch (e) { events = []; }
}
function persistEvents() {
  localStorage.setItem('board.events', JSON.stringify(events.slice(-2000)));
}
function recordMove(cardId, fromCol, toCol) {
  KanbanModel.recordEvent(events, cardId, fromCol, toCol);
  persistEvents();
}

load();
loadEvents();
if (!localStorage.getItem('board.data')) seedDemo();
persist();

function seedDemo() {
  const b = state.board;
  const c0 = b.columns[0], c1 = b.columns[1], c2 = b.columns[2];
  KanbanModel.addCard(b, c0.id, { title:'Definir el MVP', desc:'Qué entra y qué no entra en la versión 1', tag:'tag3', due:'' });
  KanbanModel.addCard(b, c0.id, { title:'Elegir plantillas', desc:'3 estilos de portafolio', tag:'tag6', due:'' });
  KanbanModel.addCard(b, c1.id, { title:'Estructura de datos', desc:'localStorage + export JSON', tag:'tag4', due:'' });
  KanbanModel.addCard(b, c2.id, { title:'Vista previa en vivo', desc:'Listo', tag:'tag8', due:new Date().toISOString().slice(0,10) });
}

function render() {
  boardEl.innerHTML = '';
  state.board.columns.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.col = col.id;

    const head = document.createElement('div');
    head.className = 'col-head';
    head.innerHTML = `<span class="col-title">${esc(col.title)}</span><span class="col-count">${col.cards.length}</span><span class="grow"></span>
      <button class="icon-btn" data-act="rename" title="Renombrar">✎</button>
      <button class="icon-btn" data-act="delcol" title="Borrar columna">🗑</button>`;
    colEl.appendChild(head);

    const cardsEl = document.createElement('div');
    cardsEl.className = 'cards';

    if (col.cards.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Suelta tarjetas aquí';
      cardsEl.appendChild(e);
    }

    col.cards.forEach(card => {
      cardsEl.appendChild(renderCard(card));
    });

    addDropHandlers(cardsEl, col.id);

    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Tarjeta';
    addBtn.style.margin = '0 10px 10px';
    addBtn.addEventListener('click', () => addCardTo(col.id));
    colEl.appendChild(cardsEl);
    colEl.appendChild(addBtn);

    colEl.querySelector('[data-act="rename"]').addEventListener('click', () => renameColumn(col.id));
    colEl.querySelector('[data-act="delcol"]').addEventListener('click', () => deleteColumn(col.id));
    boardEl.appendChild(colEl);
  });
  renderStatus();
}

function renderCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.card = card.id;
  el.innerHTML = `
    ${card.title ? `<h3>${esc(card.title)}</h3>` : '<h3 style="color:var(--muted)">(sin título)</h3>'}
    ${card.desc ? `<p>${esc(card.desc)}</p>` : ''}
    <div class="meta">
      ${card.tag ? `<span class="tag" style="background:var(--${card.tag})"></span>` : ''}
      ${card.due ? `<span class="due">📅 ${fmtDue(card.due)}</span>` : ''}
    </div>`;
  el.addEventListener('click', () => openEditor(card));
  el.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', card.id);
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

function addDropHandlers(container, colId) {
  container.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
  container.addEventListener('dragleave', () => container.classList.remove('dragover'));
  container.addEventListener('dragenter', (e) => { e.preventDefault(); container.classList.add('dragover'); });
  container.addEventListener('drop', (e) => {
    e.preventDefault();
    container.classList.remove('dragover');
    const cardId = e.dataTransfer.getData('text/plain');
    if (!cardId) return;
    const sourceCol = findCardColumn(cardId);
    if (!sourceCol) return;
    const grid = sourceCol.cards.map(c => c.id).filter(id => id !== cardId);
    const targetIds = state.board.columns.find(c => c.id === colId).cards.map(c => c.id).filter(id => id !== cardId);
    let dropIndex = computeDropIndex(container, e.clientY, cardId);
    // build full target list then moveCard to that index within target col
    KanbanModel.moveCard(state.board, sourceCol.id, cardId, colId, dropIndex);
    recordMove(cardId, sourceCol.title, state.board.columns.find(c => c.id === colId).title);
    persist(); render();
  });
}

function computeDropIndex(container, mouseY) {
  const children = [...container.querySelectorAll('.card')];
  let idx = children.length;
  children.forEach((child, i) => {
    const r = child.getBoundingClientRect();
    if (mouseY > r.top + r.height / 2) idx = i + 1;
  });
  return idx;
}

function findCardColumn(cardId) {
  return state.board.columns.find(c => c.cards.some(x => x.id === cardId));
}

function addCardTo(colId) {
  const card = KanbanModel.addCard(state.board, colId, KanbanModel.blankCard());
  persist(); render();
  openEditor(card, true);
}
function renameColumn(colId) {
  const col = state.board.columns.find(c => c.id === colId);
  const name = prompt('Nombre de la columna:', col.title);
  if (name && name.trim()) { KanbanModel.renameColumn(state.board, colId, name.trim().slice(0,30)); persist(); render(); }
}
function deleteColumn(colId) {
  if (!confirm('¿Borrar esta columna y sus tarjetas?')) return;
  KanbanModel.deleteColumn(state.board, colId);
  persist(); render();
}

// ---- Editor modal ----
let editing = null;
let freshCard = false;
function openEditor(card, isNew) {
  editing = card;
  freshCard = !!isNew;
  $('editorTitle').textContent = freshCard ? 'Nueva tarjeta' : 'Editar tarjeta';
  $('edTitle').value = card.title;
  $('edDesc').value = card.desc;
  $('edDue').value = card.due || '';
  buildTagSelect(card.tag);
  $('delBtn').style.visibility = card.desc || card.title || card.tag || card.due ? 'visible' : 'hidden';
  $('overlay').classList.add('open');
  $('edTitle').focus();
}
function closeEditor() { $('overlay').classList.remove('open'); editing = null; }

function buildTagSelect(selected) {
  const box = $('tagSelect');
  box.innerHTML = '';
  TAGS.forEach(t => {
    const b = document.createElement('div');
    b.className = 'tag-opt' + (t === '' ? ' none' : '') + (selected === t ? ' selected' : '');
    if (t) b.style.background = `var(--${t})`;
    b.title = t ? TAG_LABEL[t] : 'Sin etiqueta';
    b.addEventListener('click', () => {
      editing.tag = t; buildTagSelect(t);
    });
    box.appendChild(b);
  });
}

$('saveBtn').addEventListener('click', () => {
  if (!editing) return;
  editing.title = $('edTitle').value.trim().slice(0,80);
  editing.desc = $('edDesc').value.trim();
  editing.due = $('edDue').value;
  const col = findCardColumn(editing.id);
  if (col) { KanbanModel.updateCard(state.board, col.id, editing.id, editing); }
  persist(); render(); closeEditor();
});
$('cancelBtn').addEventListener('click', closeEditor);
$('delBtn').addEventListener('click', () => {
  if (!editing || !confirm('¿Borrar esta tarjeta?')) return;
  const col = findCardColumn(editing.id);
  if (col) KanbanModel.deleteCard(state.board, col.id, editing.id);
  persist(); render(); closeEditor();
});

// ---- Header actions ----
$('addColBtn').addEventListener('click', () => {
  const col = KanbanModel.addColumn(state.board, 'Nueva columna');
  persist(); render(); renameColumn(col.id);
});
$('themeBtn').addEventListener('click', () => {
  const light = document.body.classList.toggle('light');
  $('themeBtn').textContent = light ? '☀️' : '🌙';
});
$('exportBtn').addEventListener('click', () => {
  const fileContent = KanbanModel.serialize(state.board);
  const defaultName = 'kanban-backup-' + new Date().toISOString().slice(0,10) + '.json';
  if (window.tempoApp) {
    window.tempoApp.saveFile({ defaultName, content: fileContent });
    return;
  }
  const blob = new Blob([fileContent], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = defaultName;
  a.click(); URL.revokeObjectURL(a.href);
});
$('importBtn').addEventListener('click', () => {
  if (window.tempoApp) {
    window.tempoApp.openFile().then((res) => {
      if (!res) return;
      try {
        state.board = KanbanModel.deserialize(res.content);
        persist(); render();
      } catch (err) { alert('Archivo inválido: ' + err.message); }
    });
    return;
  }
  $('fileInput').click();
});
$('fileInput').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      state.board = KanbanModel.deserialize(r.result);
      persist(); render();
    } catch (err) { alert('Archivo inválido: ' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});

// ---- Online/offline ----
function renderStatus() {
  const on = navigator.onLine;
  $('statusDot').className = 'dot' + (on ? '' : ' offline');
  $('statusText').textContent = on ? 'online — datos guardados localmente' : 'offline — edita normal, guarda en el navegador';
}
window.addEventListener('online', renderStatus);
window.addEventListener('offline', renderStatus);

// ---- Atajo: tecla N nueva tarjeta ----
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeEditor(); return; }
  const t = e.target;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return;
  if (e.key.toLowerCase() === 'n') addCardTo(state.board.columns[0].id);
});

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDue(d) {
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}

// ---- Estadísticas ----
function renderStats() {
  const perDay = KanbanModel.completionsPerDay(events, 14);
  const max = Math.max(1, ...perDay.map(d => d.count));
  const chart = $('statsChart');
  chart.innerHTML = '';
  perDay.forEach(d => {
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.alignItems = 'center';
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (d.count === 0 ? 2 : Math.round(d.count / max * 70) + 2) + 'px';
    const n = document.createElement('span');
    n.textContent = d.count;
    bar.appendChild(n);
    const day = document.createElement('div');
    day.className = 'bar-day';
    day.textContent = String(new Date(d.key + 'T12:00:00').getDate());
    wrap.appendChild(bar);
    wrap.appendChild(day);
    chart.appendChild(wrap);
  });
  $('statsTotal').textContent = KanbanModel.totalCompletions(events);
}
$('statsBtn').addEventListener('click', () => {
  const open = $('statsPanel').classList.toggle('open');
  if (open) renderStats();
});

render();
renderStats();
</script>
</body>
</html>
