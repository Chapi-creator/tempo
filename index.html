<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e232d; --border: #2a303c;
    --text: #e6e9ef; --muted: #8b93a5; --accent: #4f8cff;
    --tag1: #ff6b6b; --tag2: #ffa94d; --tag3: #ffd43b; --tag4: #69db7c;
    --tag5: #38d9a9; --tag6: #4dabf7; --tag7: #9775fa; --tag8: #f783ac;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 18px; font-weight: 700; margin-right: auto; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tag4); }
  .dot.offline { background: var(--tag1); }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  main { padding: 20px; display: flex; gap: 16px; overflow-x: auto; align-items: flex-start; }
  .column {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    width: 280px; min-width: 280px; display: flex; flex-direction: column; max-height: calc(100vh - 140px);
  }
  .column.dragover { border-color: var(--accent); background: var(--panel2); }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .col-title { font-weight: 700; font-size: 14px; }
  .col-count { font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 20px; padding: 2px 8px; }
  .col-head .grow { flex: 1; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; font-size: 15px; }
  .icon-btn:hover { color: var(--text); }
  .cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 40px; }
  .card {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; cursor: grab; position: relative;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .card p { color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .tag { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .due { font-size: 11px; color: var(--muted); }
  .add-col-btn { align-self: center; margin: 4px; }
  /* Overlay editor */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 10; padding: 20px;
  }
  .overlay.open { display: flex; }
  .editor {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px;
  }
  .editor h2 { font-size: 16px; }
  .editor label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
  .editor input, .editor textarea, .editor select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; width: 100%;
  }
  .editor textarea { resize: vertical; min-height: 70px; }
  .editor .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .tag-select { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-opt { width: 26px; height: 26px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
  .tag-opt.selected { border-color: var(--text); }
  .tag-opt.none { background: var(--panel2); border: 1px dashed var(--border); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 16px; border: 1px dashed var(--border); border-radius: 10px; }
  body.light {
    --bg: #f3f5f9; --panel: #fff; --panel2: #f1f3f7; --border: #e0e4ec;
    --text: #1a1d24; --muted: #626a7a;
  }
  [hidden] { display: none !important; }
  /* Stats panel */
  .stats-panel {
    display: none; padding: 16px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); gap: 20px; align-items: flex-end;
  }
  .stats-panel.open { display: flex; }
  .stats-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .stats-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  .bar { width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .bar span { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }
  .bar-day { font-size: 10px; color: var(--muted); text-align: center; width: 22px; margin-top: 4px; }
  .stats-total { font-size: 24px; font-weight: 800; color: var(--accent); }
  .stats-total-label { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Tempo</h1>
  <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">online</span></span>
  <button id="themeBtn" title="Tema claro/oscuro">🌙</button>
  <button id="exportBtn" title="Guardar copia en JSON">⬇ Exportar</button>
  <button id="importBtn" title="Cargar copia desde JSON">⬆ Importar</button>
  <button id="statsBtn" title="Estadísticas">📊</button>
  <input type="file" id="fileInput" accept=".json" hidden>
  <button class="primary" id="addColBtn">+ Columna</button>
</header>

<div class="stats-panel" id="statsPanel">
  <div>
    <div class="stats-title">Tareas completadas · últimos 14 días</div>
    <div class="stats-chart" id="statsChart"></div>
  </div>
  <div>
    <div class="stats-total" id="statsTotal">0</div>
    <div class="stats-total-label">completadas en total</div>
  </div>
</div>

<main id="board" data-model="kanban.v1"></main>

<div class="overlay" id="overlay">
  <div class="editor">
    <h2 id="editorTitle">Editar tarjeta</h2>
    <label>Título <input id="edTitle" maxlength="80" placeholder="¿Qué hay que hacer?"></label>
    <label>Descripción <textarea id="edDesc" placeholder="Detalles…"></textarea></label>
    <label>Etiqueta
      <div class="tag-select" id="tagSelect"></div>
    </label>
    <label>Fecha límite <input type="date" id="edDue"></label>
    <div class="btns">
      <button id="delBtn" class="btn:red" style="margin-right:auto">🗑 Borrar</button>
      <button id="cancelBtn">Cancelar</button>
      <button class="primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
